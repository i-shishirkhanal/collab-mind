services:
  redis:
    image: redis:7-alpine
    container_name: collabmind-redis
    # Password required; published to the host loopback only.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: collabmind-ai
    # Reachable by the backend over the compose network; the host port is
    # loopback-only (local debugging). Every route but /health also requires AI_SERVICE_TOKEN.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      - UPLOADS_DIR=/app/uploads
      # Chat/study/research models (server-side only). See ai/.env.example for all knobs.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL_FLASH=${LLM_MODEL_FLASH:-deepseek-flash}
      - LLM_MODEL_PRO=${LLM_MODEL_PRO:-deepseek-v4-pro}
      - LLM_FALLBACK_PRO_TO_FLASH=${LLM_FALLBACK_PRO_TO_FLASH:-false}
      # BGE-M3 embeddings: point at the bundled `embeddings` service (profile) or a hosted endpoint.
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - RETRIEVAL_MIN_SIMILARITY=${RETRIEVAL_MIN_SIMILARITY:-0.35}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional self-hosted BGE-M3 (HuggingFace text-embeddings-inference, CPU build).
  #   docker compose --profile embeddings up -d embeddings
  # then set EMBEDDING_BASE_URL=http://embeddings:80/v1. First start downloads ~2.3 GB of weights.
  # Use a `cuda-*` TEI image plus a GPU reservation for GPU inference. See docs/phase3-ai-models-rag.md.
  # On hosts with ~4 GB RAM the default warm-up was OOM-killed (measured); `--max-batch-tokens 1024`
  # ran at ~2.5 GiB. Keep it >= CHUNK_SIZE_TOKENS (default 512): longer inputs are silently truncated.
  embeddings:
    profiles: ["embeddings"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: collabmind-embeddings
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "1024", "--max-client-batch-size", "16"]
    volumes:
      - embedding_models:/data
    expose:
      - "80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabmind-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - RATE_LIMIT_STORE=redis
      # Set to the number of reverse proxies in front of the backend (e.g. 1); otherwise every client
      # shares the proxy's IP for rate limiting. Leave empty when clients connect directly.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - AI_SERVICE_URL=http://ai:8000
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-}
      # Uploaded documents: unset bucket = shared local volume (the same volume the AI service reads).
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - UPLOADS_DIR=/app/uploads
      # Messaging attachments + calls (these features are unavailable when unset).
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health | grep ok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the browser bundle at build time (they must be the URLs the
      # BROWSER uses to reach the backend). Rebuild the image after changing them.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    container_name: collabmind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      # Auth.js (v5) refuses requests under `next start` unless the host is trusted ("UntrustedHost"; it is
      # implicit only under `next dev`). AUTH_URL pins the public origin: set NEXTAUTH_URL to the real
      # https URL in production.
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      # The frontend SERVER (NextAuth login) reaches the backend over the compose network,
      # not through the browser-facing localhost URL.
      - API_INTERNAL_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redisdata:
  uploads_data:
  embedding_models:
