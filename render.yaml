# Render Blueprint for CollabMind. Secrets (sync: false) are entered in the Render dashboard, never committed.
# Services: backend (Node), ai (Python, Docker), frontend (Next.js). Postgres is Supabase and Redis is
# Render Key Value (or Upstash). Free-tier instances sleep, which breaks websockets, the call sweeper and
# the hourly purge: use at least the "starter" plan for the backend and AI service in real use.
services:
  - type: web
    name: collabmind-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY               # Render terminates TLS in front of the app: one proxy hop
        value: "1"
      - key: RATE_LIMIT_STORE
        value: redis
      - key: DATABASE_URL              # Supabase "Session pooler" connection string
        sync: false
      - key: REDIS_URL                 # redis://:<password>@host:6379 (Key Value internal URL)
        sync: false
      - key: JWT_SECRET                # >= 32 random characters
        generateValue: true
      - key: AI_SERVICE_URL            # internal URL of collabmind-ai
        sync: false
      - key: AI_SERVICE_TOKEN          # >= 32 random characters; must equal the AI service's value
        sync: false
      - key: APP_URL                   # public frontend URL, used in verification / reset emails
        sync: false
      - key: CORS_ORIGINS              # explicit list, e.g. https://collabmind.example.com
        sync: false
      - key: SMTP_URL                  # required in production (verification and reset emails)
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GCS_BUCKET_NAME           # uploaded documents; local disk is not shared between instances
        sync: false
      - key: SUPABASE_URL              # chat attachments (optional)
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # backend only, never in the frontend
        sync: false
      - key: LIVEKIT_URL               # wss://<project>.livekit.cloud (calls, optional)
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: web
    name: collabmind-ai
    runtime: docker
    plan: starter
    rootDir: ai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: EMBEDDING_BASE_URL        # BGE-M3 endpoint (OpenAI-compatible /v1)
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: SUPABASE_URL              # document storage (same project as the backend)
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: collabmind-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /auth/signin
    envVars:
      - key: NEXT_PUBLIC_API_URL       # https://collabmind-backend.onrender.com (compiled into the bundle)
        sync: false
      - key: NEXT_PUBLIC_WS_URL        # wss://collabmind-backend.onrender.com
        sync: false
      - key: API_INTERNAL_URL          # backend URL used by the Next.js server for login
        sync: false
      - key: NEXTAUTH_URL              # public https URL of this service
        sync: false
      - key: AUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_SECRET               # set to the same value as NEXTAUTH_SECRET
        sync: false
