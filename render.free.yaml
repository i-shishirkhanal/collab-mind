# Free-tier Render Blueprint for TESTING only (frontend + backend + AI + Key Value).
# Render gives 750 free instance-hours/month per workspace and a free service only counts hours while awake,
# so three services fit for light testing but not for 24/7 use.
# Free instances sleep after ~15 min idle: websockets drop, and the call sweeper / hourly purge pause.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
# Use via: Render dashboard > New > Blueprint > pick this file (set "Blueprint path" to render.free.yaml).
services:
  - type: keyvalue
    name: collabmind-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []                    # internal connections only

  - type: web
    name: collabmind-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_STORE
        value: memory                  # single instance in testing
      - key: DATABASE_URL              # Supabase "Session pooler" connection string
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collabmind-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL            # https://collabmind-ai.onrender.com (or the internal URL)
        sync: false
      - key: AI_SERVICE_TOKEN          # >= 32 random chars; same value as the AI service
        sync: false
      - key: APP_URL                   # https://collabmind-frontend.onrender.com
        sync: false
      - key: CORS_ORIGINS              # same frontend URL, no trailing slash
        sync: false
      - key: SMTP_URL                  # required in production; Brevo/Resend/Gmail app password
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GCS_BUCKET_NAME           # optional for testing; see ALLOW_LOCAL_STORAGE_FALLBACK
        sync: false
      - key: ALLOW_LOCAL_STORAGE_FALLBACK
        value: "true"                  # ephemeral disk: uploads vanish on restart; testing only
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: collabmind-ai
    runtime: docker
    plan: free
    rootDir: ai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT                      # the Dockerfile CMD listens on 8000
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collabmind-redis
          property: connectionString
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: EMBEDDING_BASE_URL        # https://api.siliconflow.com/v1
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: SUPABASE_URL              # document storage (same project as the backend)
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: collabmind-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /auth/signin
    envVars:
      - key: NEXT_PUBLIC_API_URL       # https://collabmind-backend.onrender.com (compiled into the bundle)
        sync: false
      - key: NEXT_PUBLIC_WS_URL        # wss://collabmind-backend.onrender.com
        sync: false
      - key: API_INTERNAL_URL          # same backend URL, used by the Next.js server for login
        sync: false
      - key: NEXTAUTH_URL              # https://collabmind-frontend.onrender.com
        sync: false
      - key: AUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_SECRET               # set to the same value as NEXTAUTH_SECRET
        sync: false
